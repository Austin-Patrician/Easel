[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "easel"
version = "0.4.0"
description = "社媒内容工作流整合层 — Python 媒体与发布脚本"
requires-python = ">=3.10"
# Web/HTTP 后端是 TypeScript；这里只保留媒体处理、浏览器发布和二维码等 Python 工具依赖。
dependencies = [
    "segno>=1.6,<2",             # B站扫码登录二维码渲染（纯 Python）
    "Pillow>=10,<13", "opencv-python>=4.8,<5", "numpy>=1.26,<3",
    "pandas>=2,<4", "matplotlib>=3.8,<4", "librosa>=0.10,<1",
    "faster-whisper>=1,<2", "edge-tts>=6,<8", "playwright>=1.45,<2",
    "rembg>=2.0,<3",
    # 1.3+ 只发源码包，需要 Rust >=1.84 才能编译；1.2.9 提供 cp38-abi3 wheel。
    "biliup==1.2.9",
    "jieba>=0.42,<1", "snownlp>=0.12,<1",
    "markdown>=3.5,<4",
    "requests>=2.32,<3", "beautifulsoup4>=4.12,<5",
]

[project.scripts]
easel = "easel.cli:main"

[tool.setuptools.packages.find]
include = ["easel*"]
