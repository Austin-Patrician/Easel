name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每天 03:17 UTC 跑一次真实安装。错开整点：整点是 GitHub Actions 的高峰，
    # 排队时间明显更长。
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skills:
    name: Skill contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate skill metadata, layout and execution contracts
        run: python scripts/validate_skills.py
      - name: Check documented commands against real argparse schemas
        run: python scripts/validate_skill_commands.py
      - name: Validate documentation and Agent prompt paths
        run: python scripts/validate_document_paths.py

  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Easel and test dependencies
        timeout-minutes: 20
        run: python -m pip install --prefer-binary -e . pytest
      # 技能自带的用例在 skills/**/tests/ 下；从根目录跑一次，覆盖 tests/ 与技能测试。
      - name: Run Python tests
        timeout-minutes: 10
        run: python -m pytest -q -o faulthandler_timeout=90

  typescript:
    name: TypeScript and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/frontend/package-lock.json
      - name: Install Node dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix web/frontend ci --no-audit --no-fund
      - name: Typecheck server
        run: npm run typecheck
      - name: Lint frontend
        run: npm --prefix web/frontend run lint
      - name: Frontend regression tests
        run: node --test tests/frontend/*.test.mjs
      - name: Build server and frontend
        run: npm run build
      - name: Server unit tests
        run: npm run test:server

  # 两个安装脚本此前在 CI 里零覆盖。这个 job 全程在 ubuntu 上跑（shellcheck 与
  # PSScriptAnalyzer 都是跨平台的），不下载项目依赖，适合挂在每个 PR 上。
  lint-installers:
    name: Installer lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bash syntax
        run: |
          bash -n setup.sh
          bash -n scripts/cleanup_outputs.sh
          bash -n scripts/wechat-egress.sh

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning
          # 技能自带的 vendor 脚本不在本仓库维护范围内
          ignore_paths: skills/builtin/video-production/vendor

      # PowerShell 侧：解析 + 静态分析。作者的开发机是 Linux，改 setup.ps1 没法本地验证，
      # 这里是唯一的把关点，所以 Error 级别直接判失败。
      # 只检查我们自己维护的 .ps1：vendor/video-pipeline-sdk 下那几个不在本仓库范围内，
      # 扫进来只会把真问题埋在噪音里（shellcheck 那边也同样排除了该目录）。
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $files = git ls-files '*.ps1' | Where-Object { $_ -notmatch 'vendor/' }
          if (-not $files) { throw '没找到要检查的 .ps1' }
          $bad = $false
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { Write-Host "== $f"; $errors | Format-List; $bad = $true }
          }
          if ($bad) { throw 'PowerShell 解析失败（注意 setup.ps1 必须保持 UTF-8 with BOM）' }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $files = git ls-files '*.ps1' | Where-Object { $_ -notmatch 'vendor/' }
          if (-not $files) { throw '没找到要检查的 .ps1' }
          # -Path 只收单个字符串，传数组会抛错却仍让这一步「0 findings」通过 —— 必须逐个扫。
          $r = @($files | ForEach-Object {
                  Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1 })
          Write-Host "扫描 $($files.Count) 个文件，findings: $($r.Count)"
          if ($r) { $r | Format-Table -AutoSize RuleName,Severity,ScriptName,Line,Message }
          if ($r | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer 报告了 Error' }

  # 真·跑一遍安装。只在 nightly / 手动触发 / 打了 ci:full-install 标签的 PR 上跑：
  # 一次完整安装要下 ~1GB（pip 的 opencv/rembg + npm + Chromium），
  # windows-latest 上 I/O 更慢且按 2 倍计费，挂在每个 PR 上并不现实。
  install-real:
    name: Real install (${{ matrix.os }})
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'ci:full-install')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # CI 里没有真 key。doctor 的认证检查是静态的（只判「非空且非占位符」），
      # 给一个语法合法的假值即可走通整条配置链路。
      - name: Seed .env
        shell: bash
        run: |
          cp .env.example .env
          printf '\nEASEL_DIRECT_API_KEY=sk-ci-not-a-real-key-0123456789\n' >> .env
          printf 'EASEL_DIRECT_API_BASE_URL=https://example.invalid/v1\n' >> .env
          printf 'EASEL_DIRECT_API_MODEL=ci-placeholder\n' >> .env

      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: bash setup.sh

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: powershell       # 5.1：Windows 自带版本，必须按它验证
        run: powershell -ExecutionPolicy Bypass -File ./setup.ps1

      # 这条是重点：setup 必须可重入。npm ci / venv / .env 创建都要能重复跑。
      - name: Install again (idempotency, Linux)
        if: runner.os == 'Linux'
        run: bash setup.sh

      - name: Install again (idempotency, Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File ./setup.ps1

      - name: doctor
        shell: bash
        run: |
          if [ -x .venv/bin/easel ]; then .venv/bin/easel doctor
          else .venv/Scripts/easel.exe doctor; fi
